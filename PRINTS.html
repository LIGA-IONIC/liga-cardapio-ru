<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Â· Cardapio RU</title>
<link rel="stylesheet" href="prints.css">
<style>body{background:#fff;padding:16px 12px 32px}.exemplo{text-align:center;font-size:0.72rem;letter-spacing:0.16em;font-weight:800;color:#94a3b8;margin:0 0 12px}.bloco h2{display:none}.fone{box-shadow:none;border:0;border-radius:12px;min-height:0}.tb{background:#b45309}.btn.main{background:#b45309}</style>
</head>
<body>
<p class="exemplo">EXEMPLO VISUAL</p>
<div class="grid">
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Cardapio RU</span><span style="font-weight:600;font-size:0.8rem;">sair</span></div>
      <div class="pad">
        <div class="item"><div><strong>Arroz + feijao</strong><div class="muted">comum</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Opcao vegana</strong><div class="muted">veg</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Frango grelhado</strong><div class="muted">comum</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Salada</strong><div class="muted">veg · esgotou</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Sobremesa</strong><div class="muted">comum</div></div><span class="badge ok">+</span></div>
        <button class="btn main">Continuar</button>
      </div>
    </div>
  </div>
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Cardapio RU</span><span style="font-weight:600;font-size:0.8rem;">voltar</span></div>
      <div class="pad">
        <span class="chip on">Veg</span><span class="chip">Comum</span><span class="chip">Todos</span><div class="item" style="margin-top:8px;"><div><strong>Opcao vegana</strong></div><span class="badge ok">ok</span></div><div class="item"><div><strong>Salada</strong><div><span class="badge bad">esgotou</span></div></div><span class="badge off">—</span></div><div class="aviso erro">Item esgotado nao entra no pedido</div><button class="btn main">Confirmar bandeja</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
